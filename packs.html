<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Packs - NXTUP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cards.css">
  <link rel="stylesheet" href="packs.css">
</head>
<body>
  <main class="page">
    <h1 class="page-title">Packs</h1>
    <p class="section-note">Spend points to open a pack, then your cards will flip over one by one.</p>
    <p id="status" class="status" role="status"></p>

    <section id="stage-section" class="stage" hidden>
      <div class="stage-head">
        <h2 class="section-title">Your pull</h2>
        <div class="stage-actions">
          <button id="reveal-all" class="btn btn-quiet btn-small" type="button" hidden>Skip</button>
          <a class="btn btn-quiet btn-small" href="cards.html">View cards</a>
        </div>
      </div>
      <ul id="pack-cards" class="deal-grid"></ul>
    </section>

    <section>
      <h2 class="section-title">Choose a pack</h2>
      <ul id="packs" class="pack-grid"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="cards.js"></script>
  <script src="packs.js"></script>
</body>
</html>
